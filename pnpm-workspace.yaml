# Every version is pinned once, in the catalog above: `pnpm add` records the pin here and writes
# "catalog:" into package.json, and a version that differs from the catalog entry is rejected.
catalogMode: strict

# esbuild's postinstall is the only install script in the tree. It only validates the platform
# binary and swaps in a faster shim, so build.mjs, tsx and Vite work without it: it stays ignored.
# better-sqlite3 ships its prebuilt binaries inside the npm tarball and declares no install script
# (stack-probe P9); pnpm only assumes `node-gyp rebuild` because the tarball holds a binding.gyp, and a
# compiler is neither available in the image nor wanted.
ignoredBuiltDependencies:
  - esbuild
  - better-sqlite3

# Radix Select 2.3.8 injects an inline <style> through a Trusted Types sink that the production CSP
# (require-trusted-types-for 'script') blocks. The patch removes it; the same rule is in
# apps/web/src/styles/app.css. Guard: apps/web/test/csp-sinks.test.ts. Drop the patch when upstream
# renders the style with a nonce or without a sink.
patchedDependencies:
  '@radix-ui/react-select@2.3.8': patches/@radix-ui__react-select@2.3.8.patch

# Silences ONE known peer conflict and nothing else: eslint-plugin-jsx-a11y 6.10.2 (last release
# 2024-10-26, unmaintained) declares eslint "<=9", yet all its rules fire on ESLint 10 (stack-probe
# P2). The key names the parent so that any other plugin that does not support ESLint 10 is still
# reported. ESLint 9 is deprecated, so lowering eslint is not the way out; if the plugin ever breaks,
# replace it. See tools/INSTALL-PROTOCOL.md.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'

# A dependency with an install script that is neither ignored above nor allowed fails the frozen
# install (ERR_PNPM_IGNORED_BUILDS) instead of printing a warning. See tools/INSTALL-PROTOCOL.md.
strictDepBuilds: true

# Without this pnpm installs both the glibc and the musl variant of every native package (sharp:
# +19 MB, stack-probe P10). The runtime image is glibc (distroless debian12) and a musl builder
# must not be used for it. pnpm only honours the setting when it fetches full registry metadata
# (pnpm add and pnpm install do, pnpm remove does not): see "REMOVING a dependency" in
# tools/INSTALL-PROTOCOL.md.
supportedArchitectures:
  libc: [glibc]
