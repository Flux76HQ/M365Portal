<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline</title>
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <main>
      <section lang="nl" data-language="nl">
        <h1>Je bent offline</h1>
        <p>
          Er is geen verbinding met de server. Controleer je netwerk en probeer het opnieuw. Er is
          niets opgeslagen of in de wachtrij gezet.
        </p>
        <button type="button" data-action="reload">Opnieuw proberen</button>
      </section>
      <section lang="en" data-language="en">
        <h1>You are offline</h1>
        <p>
          There is no connection to the server. Check your network and try again. Nothing was saved
          or queued.
        </p>
        <button type="button" data-action="reload">Try again</button>
      </section>
    </main>
    <noscript>
      <p>Opnieuw laden: gebruik de verversknop van je browser. Reload with your browser button.</p>
    </noscript>
    <script src="/offline.js"></script>
  </body>
</html>
