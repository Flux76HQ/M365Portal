# M365Portal: Docker Compose example (FR-A-166). One service, one container, one volume.
#
#   docker compose up -d      start (the image is pulled, never built here)
#   docker compose down       stop and remove the container; the volume with your data stays
#
# Before the first start (Phase B), create the sealing key as a file. It is a Docker secret: it
# reaches the container as /run/secrets/app_key and APP_KEY_FILE names it, so the key is neither in
# the process list nor in `docker inspect`. The image has no shell, so the commands run Node:
#
#   mkdir -p secrets && docker run --rm <the image named below> dist/cli.js generate-app-key > secrets/app_key
#   docker compose up -d
#   docker exec m365portal-m365portal-1 /nodejs/bin/node dist/cli.js setup-token     the setup token
#   docker exec m365portal-m365portal-1 /nodejs/bin/node dist/cli.js setup-reopen --confirm   reopen setup
#
# Keep secrets/app_key out of git and back it up SEPARATELY from the data volume: whoever holds the
# volume and the key holds the application certificate. The container name above is the Compose
# default (project name, service, number); `docker compose ps` shows yours.
#
# The settings live in `.env` next to this file (copy `.env.example`; the file is optional).
# HOST_PORT and PUBLIC_BASE_URL are the only ones you normally change. HOST_PORT is read by
# Compose only: it is the port the browser connects to. PUBLIC_BASE_URL is the origin the browser
# uses, and every write is compared with it, so it must match: by default it follows HOST_PORT.
# The panel then answers on http://localhost:9300 .

name: m365portal

services:
  m365portal:
    # Production: pin a version tag or, better, a digest (image@sha256:...) instead of "latest", so
    # an update is a decision of yours and a rollback is a one-line change.
    image: ghcr.io/flux76hq/m365portal:latest
    restart: unless-stopped
    # The host port on the left, the port inside the container on the right (PORT, default 9300).
    # To publish on loopback only (a host that a reverse proxy on the same machine fronts), use
    # this mapping instead:
    # 127.0.0.1:${HOST_PORT:-9300}:${PORT:-9300}
    ports:
      - '${HOST_PORT:-9300}:${PORT:-9300}'
    # What the application reads (see .env.example). A setting that .env leaves out stays unset
    # here, so the default of the application is the only default there is. HOST and DATA_DIR are
    # not passed on: the image fixes them, and DATA_DIR must match the volume below.
    environment:
      PORT: ${PORT:-9300}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${HOST_PORT:-9300}}
      TRUST_PROXY:
      SHOWCASE:
      LOG_LEVEL:
      HSTS_MAX_AGE:
      HSTS_INCLUDE_SUBDOMAINS:
      HSTS_PRELOAD:
      # The sealing key is the Docker secret below; APP_KEY is therefore not passed on (setting both
      # is a configuration error).
      APP_KEY_FILE: /run/secrets/app_key
      APP_KEY_PREVIOUS:
      APP_KEY_PREVIOUS_FILE:
      SETUP_TOKEN:
      BOOTSTRAP_CLIENT_ID:
      SETUP_PROPAGATION_TIMEOUT_SECONDS:
      SESSION_IDLE_TIMEOUT_MINUTES:
      SESSION_ABSOLUTE_TIMEOUT_HOURS:
      GROUP_CACHE_TTL_SECONDS:
      AUTH_REQUIRE_MFA:
      AUTH_MFA_AMR_VALUES:
      BREAK_GLASS_USERNAME:
      BREAK_GLASS_PASSWORD_HASH:
      EXCHANGE_KEY_HANDOVER:
    # The sealing key as a file (FR-B-705), created as the header says.
    secrets:
      - app_key
    # The database and the uploaded files. The only place the container writes besides /tmp.
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    # Docker's default of 10 seconds equals the 10 second drain of the application.
    stop_grace_period: 15s
    # The same check as the image: a Node script (the image has no shell and no curl) that asks
    # /readyz on the configured PORT, so an unusable volume shows as unhealthy.
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'dist/healthcheck.js']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  data:

secrets:
  app_key:
    file: ./secrets/app_key
